<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#103B46">
  <title>Panel del técnico – SigueTuCaso</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/plus-jakarta-sans-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="marca" href="/"><span class="marca-punto" aria-hidden="true"></span>SigueTuCaso</a>
    <span class="topbar-etiqueta">Panel del técnico</span>
  </header>

  <main class="pagina pagina-ancha">
    <!-- La clave se guarda en sessionStorage (AGENTS.md 7.7) -->
    <form id="form-clave" class="card card-clave formulario" novalidate hidden>
      <h1>Panel del técnico</h1>
      <p class="secundario">Escribe la clave para ver y atender las solicitudes.</p>
      <div class="campo">
        <label for="clave">Clave del técnico</label>
        <input id="clave" name="clave" type="password" autocomplete="current-password"
               aria-describedby="error-clave" required>
        <p id="error-clave" class="mensaje-error" role="alert"></p>
      </div>
      <button class="boton boton-primario boton-ancho" type="submit">Entrar</button>
    </form>

    <section id="panel" hidden>
      <header class="panel-barra">
        <div>
          <h1>Solicitudes</h1>
          <p class="secundario">Todas las solicitudes en un solo lugar, de la más reciente a la más antigua.</p>
        </div>
        <div class="panel-acciones">
          <p class="abiertas"><strong id="total-abiertas">0</strong> <span id="texto-abiertas">abiertas</span></p>
          <label for="filtro-estado" class="sr-only">Filtrar por estado</label>
          <select id="filtro-estado">
            <option value="">Todas</option>
          </select>
          <button id="boton-salir" type="button" class="boton boton-borde">Salir</button>
        </div>
      </header>

      <p id="error-panel" class="mensaje-error" role="alert"></p>
      <div id="sin-solicitudes" class="vacio" hidden>
        <p class="vacio-titulo">No hay solicitudes con este estado</p>
        <p class="secundario">Elige otro estado en el filtro o vuelve a "Todas".</p>
      </div>
      <ul id="lista-solicitudes" class="lista-solicitudes"></ul>
    </section>
  </main>

  <!-- Plantilla de cada solicitud: js/tecnico.js la copia y la llena con textContent -->
  <template id="plantilla-solicitud">
    <li class="solicitud">
      <div class="solicitud-cabecera">
        <strong class="s-codigo"></strong>
        <span class="etiqueta-estado s-estado"></span>
      </div>
      <p class="s-servicio"></p>
      <p class="s-descripcion"></p>
      <details>
        <summary>Ver detalle</summary>
        <dl class="detalle">
          <dt>Nombre</dt><dd class="s-nombre"></dd>
          <dt>Correo</dt><dd class="s-correo"></dd>
          <dt>Desde cuándo</dt><dd class="s-desde"></dd>
          <dt>Qué intentó</dt><dd class="s-intento"></dd>
          <dt>Reportada</dt><dd class="s-creado"></dd>
          <dt>Última actualización</dt><dd class="s-actualizado"></dd>
        </dl>
      </details>

      <section class="respuestas" hidden>
        <p class="respuestas-titulo">Respuestas del solicitante</p>
        <ol class="s-respuestas"></ol>
      </section>

      <form class="form-responsable" novalidate>
        <label>Responsable
          <input class="s-responsable" name="responsable" type="text" maxlength="100"
                 placeholder="Nombre de quien la atiende">
        </label>
        <button class="boton boton-borde" type="submit">Asignar</button>
        <p class="mensaje-error s-error" role="alert"></p>
        <p class="mensaje-ok s-ok" role="status"></p>
      </form>

      <!-- La nota es obligatoria cuando el estado es "Esperando tu respuesta" -->
      <form class="form-estado" novalidate>
        <label>Estado
          <select class="s-nuevo-estado" name="estado"></select>
        </label>
        <label class="s-campo-nota" hidden>Nota para el solicitante
          <textarea class="s-nota" name="nota" rows="2" maxlength="300"
                    placeholder="Ejemplo: envíanos una captura del error que te aparece."></textarea>
        </label>
        <button class="boton boton-secundario" type="submit">Guardar estado</button>
        <p class="mensaje-error s-error-estado" role="alert"></p>
        <p class="mensaje-ok s-ok-estado" role="status"></p>
      </form>
    </li>
  </template>

  <script src="js/tecnico.js"></script>
</body>
</html>
